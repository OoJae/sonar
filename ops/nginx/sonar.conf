# nginx vhost for sonar.my.id.
#
# Committed copy of /etc/nginx/sites-available/sonar so the infra-as-code
# story is honest. Generated and amended by certbot for the TLS terminator
# block; the upstream proxy_pass to 127.0.0.1:3005 matches the Sonar systemd
# unit (ops/systemd/sonar.service).
#
# Deploy: copy to /etc/nginx/sites-available/sonar, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    server_name sonar.my.id 43.153.109.3 _;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js Turbopack dev HMR uses websockets; harmless in production
        # but kept so dev mode behind this proxy still works.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Agent cycles can run 30-60s; bump read/send timeouts so the
        # upstream Next route handler does not get cut mid-cycle by nginx.
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sonar.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sonar.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = sonar.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sonar.my.id 43.153.109.3 _;
    return 404; # managed by Certbot
}
